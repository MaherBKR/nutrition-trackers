publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
